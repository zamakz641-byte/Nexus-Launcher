name: Nexus Launcher V1.0 Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types and tests
        run: |
          npm run typecheck
          npm test

      - name: Build Windows executables
        run: npm run dist:win

      - name: Verify release files
        shell: pwsh
        run: |
          $setup = 'release/Nexus-Launcher-Setup-1.0.0-x64.exe'
          $portable = 'release/Nexus-Launcher-Portable-1.0.0-x64.exe'
          foreach ($path in @($setup, $portable)) {
            if (!(Test-Path $path)) { throw "Missing executable: $path" }
            if ((Get-Item $path).Length -lt 20MB) { throw "Executable is unexpectedly small: $path" }
          }
          Get-FileHash $setup, $portable -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Launcher-V1.0-Windows-x64
          path: |
            frontend/release/Nexus-Launcher-Setup-1.0.0-x64.exe
            frontend/release/Nexus-Launcher-Portable-1.0.0-x64.exe
            frontend/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 release/Nexus-Launcher-Setup-1.0.0-x64.exe release/Nexus-Launcher-Portable-1.0.0-x64.exe release/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Nexus Launcher V1.0' --notes-file RELEASE_NOTES.md --latest
