name: Build Windows release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Fetch redistributable PNG UI assets
        run: python scripts/fetch_ui_assets.py

      - name: Fetch redistributable UI SFX
        run: python scripts/fetch_sfx.py

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build React frontend
        run: npm run build

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-build.txt

      - name: Backend tests
        run: python -m pytest -q

      - name: Build NexusLauncher.exe
        run: python -m PyInstaller --noconfirm --clean --distpath build/release --workpath build/pyinstaller NexusLauncher.spec

      - name: Smoke-check executable
        shell: pwsh
        run: |
          if (!(Test-Path 'build/release/NexusLauncher.exe')) { throw 'NexusLauncher.exe missing' }
          $size = (Get-Item 'build/release/NexusLauncher.exe').Length
          if ($size -lt 5MB) { throw "Executable is suspiciously small: $size bytes" }
          Write-Host "NexusLauncher.exe size: $([Math]::Round($size / 1MB, 2)) MB"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLauncher-Windows
          path: build/release/NexusLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish/update beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.7.0'
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag build/release/NexusLauncher.exe --target $env:GITHUB_SHA --title 'Nexus Launcher 1.7' --notes 'Nexus Launcher 1.7. Cinematic home, GSAP navigation transitions, Remotion launch sequence, reduced-motion mode, controller navigation, local-first library, Steam/Epic/GOG import and low-impact game mode.'
          } else {
            gh release upload $tag build/release/NexusLauncher.exe --clobber
          }
