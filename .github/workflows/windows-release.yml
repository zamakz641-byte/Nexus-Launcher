name: Nexus Launcher Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types and tests
        run: |
          npm run typecheck
          npm test

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }

      - name: Build Windows executables
        run: npm run dist:win

      - name: Verify release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = "release/Nexus-Launcher-Setup-$version-x64.exe"
          $portable = "release/Nexus-Launcher-Portable-$version-x64.exe"
          foreach ($path in @($setup, $portable)) {
            if (!(Test-Path $path)) { throw "Missing executable: $path" }
            if ((Get-Item $path).Length -lt 20MB) { throw "Executable is unexpectedly small: $path" }
          }
          Get-FileHash $setup, $portable -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Launcher-Windows-x64
          path: |
            frontend/release/Nexus-Launcher-Setup-*.exe
            frontend/release/Nexus-Launcher-Portable-*.exe
            frontend/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @("release/Nexus-Launcher-Setup-$version-x64.exe", "release/Nexus-Launcher-Portable-$version-x64.exe", 'release/SHA256SUMS.txt')
          gh release create $env:GITHUB_REF_NAME @assets --target $env:GITHUB_SHA --title "Nexus Launcher V$version" --notes-file RELEASE_NOTES.md --latest
