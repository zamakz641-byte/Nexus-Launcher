<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus · Intro intégrée</title>
  <style>
    html,body{height:100%;margin:0;background:#020508;font-family:Segoe UI,sans-serif;color:#d8e8f3}
    body{display:grid;grid-template-rows:52px 1fr}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff15;font-size:12px;gap:15px}
    button{padding:8px 14px;color:#e6f2fa;background:#122330;border:1px solid #b7d5ea35;border-radius:20px;cursor:pointer}
    iframe{width:100%;height:100%;border:0}
    button:focus-visible{outline:2px solid #a9d9ff;outline-offset:3px}
  </style>
</head>
<body>
  <header><span>NEXUS LAUNCHER · Sources actuelles · Intro FR / EN selon la langue</span><button id="replay" type="button">Rejouer l’intro</button></header>
  <iframe id="preview" src="/?intro=1" title="Nexus Launcher avec le film de démarrage" allow="autoplay; fullscreen; gamepad"></iframe>
  <script>document.querySelector('#replay').addEventListener('click',()=>{document.querySelector('#preview').src='/?intro=1&replay='+Date.now()});</script>
</body>
</html>
